[package]
name = "schemdraw-pfd"
version = "0.1.0"
edition = "2024"
description = "PFD / P&ID generator: auto layout and fewest-bend orthogonal pipe routing (Rust port of schemdraw-pfd)"

[lib]
name = "pfd"
path = "src/lib.rs"

[[bin]]
name = "pfd"
path = "src/main.rs"

[dependencies]
indexmap = "2.14.2"
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.1"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2
