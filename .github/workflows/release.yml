name: Release

# Push a tag such as v0.2.0 to publish a GitHub Release.  The tag must match
# the version in both pyproject.toml and rust/Cargo.toml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag matches pyproject.toml and rust/Cargo.toml
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          py = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          rs = tomllib.load(open("rust/Cargo.toml", "rb"))["package"]["version"]
          print(f"tag={tag} pyproject={py} cargo={rs}")
          if not tag == py == rs:
              sys.exit("the tag and the two versions must all be the same")
          PY

  test:
    name: Test
    needs: check-version
    uses: ./.github/workflows/ci.yml

  python:
    name: Build Python artifacts
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build pfd.py, wheel and sdist
        run: |
          pip install build
          python tools/build_single.py
          python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/*
          if-no-files-found: error

  rust:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: pfd }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: pfd }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: pfd.exe }
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          name="pfd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "../out/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md "../out/$name/"
          cd ../out
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [python, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
