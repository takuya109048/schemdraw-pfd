[project]
name = "schemdraw-pfd"
version = "0.2.0"
description = "Grid-based PFD / P&ID generator on top of SchemDraw: auto layout and fewest-bend orthogonal pipe routing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
dev = [
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
pfd = "schemdraw_pfd.cli:main"

[tool.setuptools.package-data]
"*" = ["py.typed", "*.md", "*.txt"]

[tool.ruff]
line-length = 88
extend-exclude = ["src/schemdraw_pfd/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pyrefly]
project-includes = ["src", "tests", "tools"]
project-excludes = ["src/schemdraw_pfd/_vendor/**"]
search-path = ["src", "tests"]
